name: Build SIMON Windows agent
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['agent/**', 'tools/build_agent.py', 'tools/requirements-build.txt', 'deployment/agent/**', '.github/workflows/build-agent.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r tools/requirements-build.txt
      - run: python -m tools.build_agent
      - uses: actions/upload-artifact@v4
        with:
          name: SIMONAgent-template-Windows-x64
          path: release/SIMONAgent-template.zip
          retention-days: 30
