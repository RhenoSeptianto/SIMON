name: Build SIMON Windows agent
on:
  workflow_dispatch:
  push:
    branches: [main, master]
concurrency:
  group: simon-agent-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r tools/requirements-build.txt
      - run: python -m tools.build_agent
      - uses: actions/upload-artifact@v4
        with:
          name: SIMONAgent-template-Windows-x64
          path: release/SIMONAgent-template.zip
          retention-days: 30
      - name: Publish rolling latest agent template
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view agent-latest --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload agent-latest release/SIMONAgent-template.zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create agent-latest release/SIMONAgent-template.zip --title "SIMON Agent terbaru" --notes "Artifact agent Windows x64 terbaru. Gunakan paket kantor dari UpdateSimon agar CA publik kantor disertakan." --latest=false --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
          }
